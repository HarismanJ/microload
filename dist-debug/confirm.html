<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Confirmed — microload</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2e8f0;
      padding: 24px;
    }

    .card {
      background: #161b27;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
    }

    .icon {
      width: 56px;
      height: 56px;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .icon svg {
      width: 26px;
      height: 26px;
      stroke: #22c55e;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
      margin: 24px 0;
    }

    .hint {
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12" />
      </svg>
    </div>
    <h1>Email confirmed</h1>
    <p>Your account is ready. You can close this page and sign into the app.</p>
    <div class="divider"></div>
    <p class="hint">Opened the wrong tab? Just close this window.</p>
  </div>
</body>
</html>
