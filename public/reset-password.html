<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — microload</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #94a3b8;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <span>Redirecting…</span>
  <script>
    // Mark that a password recovery flow is in progress so the main app
    // can show the reset-password form instead of the normal home screen.
    try { localStorage.setItem('microload:pendingRecovery', '1') } catch (_) {}

    // Forward to the main app, preserving the Supabase PKCE code and type
    // params so the Supabase client can exchange them for a session on load.
    var search = window.location.search   // e.g. ?code=xxx&type=recovery
    var hash   = window.location.hash    // e.g. #access_token=xxx (implicit flow)
    window.location.replace('/' + search + hash)
  </script>
</body>
</html>
